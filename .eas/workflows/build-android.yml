# Builds the Android APK when code is pushed to the "build" branch (saves the monthly build quota).
name: Build Android APK

on:
  push:
    branches: ['build']
    # Only app changes start a build (server-only changes don't use a build).
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'eas.json'
      - 'index.js'

jobs:
  build_android:
    name: Build Android APK
    type: build
    params:
      platform: android
      profile: production
